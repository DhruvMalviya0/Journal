name: Daily Coursework Journal Submission

on:
  schedule:
    # 4:00 PM IST (16:00 IST) = 10:30 AM UTC, Monday to Friday (1-5)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  submit-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Decode storageState.json from Secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$STORAGE_STATE_BASE64" ]; then
            echo "::error::STORAGE_STATE_BASE64 secret is missing!"
            exit 1
          fi
          echo "$STORAGE_STATE_BASE64" | base64 -d > storageState.json

      - name: Run Daily Journal Submission Script
        env:
          DISABLE_SUBMIT: ${{ secrets.DISABLE_SUBMIT }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: npm start
