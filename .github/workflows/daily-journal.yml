name: Daily Coursework Journal Submission

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 4:00 PM IST (16:00 IST) = 10:30 AM UTC, Monday–Friday only
    - cron: '30 10 * * 1-5'
    # Health-check run (dry-run) to detect session expiry earlier
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  submit-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Decode storageState.json from Secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$STORAGE_STATE_BASE64" ]; then
            echo "::error::STORAGE_STATE_BASE64 secret is missing or empty!"
            exit 1
          fi
          echo "$STORAGE_STATE_BASE64" | tr -d '\r\n' | base64 -d > storageState.json
          echo "storageState.json restored successfully."

      - name: Get current date in target timezone
        id: date
        run: echo "today=$(node -e 'import("./src/summarizer.js").then(m => console.log(m.getFormattedToday(process.env.TIMEZONE || "Asia/Kolkata")))')" >> $GITHUB_OUTPUT
        env:
          TIMEZONE: ${{ secrets.TIMEZONE }}

      - name: Restore daily submission state from cache
        uses: actions/cache/restore@v4
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}

      - name: Run Journal Submission Script
        id: submit
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          ENTRY_MAP: ${{ secrets.ENTRY_MAP }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          COMMIT_READ_TOKEN: ${{ secrets.COMMIT_READ_TOKEN }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          STORAGE_STATE_PATH: storageState.json
          DISABLE_SUBMIT: ${{ github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5' && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5' && 'true' || 'false' }}
        run: |
          set +e
          npm start 2>&1 | tee submit.log
          submit_exit=${PIPESTATUS[0]}
          set -e
          status_file=".submission_status.json"
          status_value=$(node -e "const fs=require('fs');try{const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8')).status;process.stdout.write(typeof v==='string'?v:'UNKNOWN');}catch{process.stdout.write('UNKNOWN');}" "$status_file")
          echo "submission_status=$status_value" >> "$GITHUB_OUTPUT"

          if [ "$submit_exit" -eq 0 ]; then
            exit 0
          fi

          if [ "$status_value" = "AUTH_EXPIRED" ]; then
            echo "auth_expired=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Google session appears expired. Run 'npm run refresh-session' locally and update the STORAGE_STATE_BASE64 secret."
            exit 0
          fi

          exit "$submit_exit"

      - name: Create or update auth-expired reminder issue
        if: steps.submit.outputs.auth_expired == 'true'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TODAY: ${{ steps.date.outputs.today }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Action required: refresh Google session for coursework journal';
            const body = [
              'The automated journal job detected an expired Google session (`AUTH_EXPIRED`).',
              '',
              `- Date: ${process.env.TODAY}`,
              `- Workflow run: ${process.env.RUN_URL}`,
              '',
              'Please run `npm run refresh-session` locally and update the `STORAGE_STATE_BASE64` repository secret.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Save daily submission state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}
